databases:
  - name: s2answer-db
    plan: free # Change to basic-256mb for production with persistent storage
    databaseName: quizboard
    user: quizboard

services:
  - type: web
    name: s2answer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: s2answer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Frontend URL (comma-separated if multiple, e.g. https://your-frontend.onrender.com)
      - key: FRONTEND_ORIGIN
        value: "http://localhost:3000"
      - key: SMTP_PORT
        value: "587"
