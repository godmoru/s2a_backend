databases:
  - name: s2answer-db
    plan: basic-256mb # use "free" for testing only; free databases expire after 30 days
    databaseName: quizboard
    user: quizboard

services:
  - type: web
    name: s2answer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: s2answer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Frontend URL (comma-separated for several), e.g. https://s2answer-web.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
